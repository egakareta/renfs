[tools]
"github:Unreal-Works/cmdshim" = "latest"
"github:trunk-rs/trunk" = "latest"
lefthook = "latest"
oxfmt = "latest"
rust = "latest"

[hooks]
postinstall = ["lefthook install"]

[tasks.check]
description = "Run all linting and formatting checks"
depends = ["lint"]
run = "mise format:cargo --check && mise format:oxfmt --check"

[tasks.format]
description = "Format .rs/.toml/.yml"
depends = ["format:cargo", "format:oxfmt"]

[tasks."format:cargo"]
description = "Format .rs"
run = "cargo fmt --all"

[tasks."format:oxfmt"]
description = "Format .toml/.yml"
run = "oxfmt"

[tasks.lint]
description = "Lint .rs"
run = "cargo clippy --all-targets --all-features --workspace -- -D warnings"

[tasks.test]
description = "Run .rs tests"
run = "cargo test --all-targets --all-features"

[env]
_.path = { path = ["{{ exec(command='cmdshim path') }}"], tools = true }

[_.cmdshim.renfs]
run = [
  "cargo",
  "run",
  "--quiet",
  "--manifest-path",
  "{{config_root}}/Cargo.toml",
  "--all-features",
  "--",
]
