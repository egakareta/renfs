[tools]
"github:Unreal-Works/cmdshim" = "latest"
"github:trunk-rs/trunk" = "latest"
"github:wasm-bindgen/wasm-pack" = "latest"
lefthook = "latest"
oxfmt = "latest"
rust = { version = "latest", components = [
  "clippy",
  "rustfmt",
  "rust-src",
], targets = [
  "wasm32-unknown-unknown",
] }

[hooks]
postinstall = ["lefthook install"]

[tasks.check]
description = "Run all linting and formatting checks"
depends = ["lint"]
run = "mise format:cargo --check && mise format:oxfmt --check"

[tasks.format]
description = "Format .rs/.toml/.yml"
depends = ["format:cargo", "format:oxfmt"]

[tasks."format:cargo"]
description = "Format .rs"
run = "cargo fmt --all"

[tasks."format:oxfmt"]
description = "Format .toml/.yml"
run = "oxfmt"

[tasks.lint]
description = "Lint .rs"
run = "cargo clippy --all-targets --all-features --workspace -- -D warnings"

[tasks.test]
description = "Run .rs tests for native and wasm"
run = "mise run test:native && mise run test:wasm"

[tasks."test:native"]
description = "Run .rs tests for native"
run = "cargo test --all-features -- --nocapture"

[tasks."test:wasm32"]
description = "Run .rs tests for wasm32"
run = "wasm-pack test --headless --chrome"
env = { RUST_TEST_NOCAPTURE = 1 }

[tasks."test:wasm64"]
description = "Run .rs tests for wasm64"
run = "wasm-pack test --mode no-install --headless --chrome --target wasm64-unknown-unknown"
env = { CARGO_UNSTABLE_BUILD_STD = "std,panic_abort", RUSTC_BOOTSTRAP = 1, RUST_TEST_NOCAPTURE = 1 }

[tasks.vendor]
description = "Regenerate vendored dependencies"
run = "renfs vendor/zenfs.js"

[env]
_.path = { path = ["{{ exec(command='cmdshim path') }}"], tools = true }

[_.cmdshim.renfs]
run = [
  "cargo",
  "run",
  "--quiet",
  "--manifest-path",
  "{{config_root}}/Cargo.toml",
  "--all-features",
  "--",
]
