[package]
name = "renfs"
version = "0.3.0"
edition = "2024"
description = "Bindings for ZenFS: A filesystem, anywhere"
documentation = "https://docs.rs/renfs"
readme = "README.md"
homepage = "https://github.com/egakareta/renfs"
repository = "https://github.com/egakareta/renfs"
license = "MIT"
keywords = ["bindings", "browser", "filesystem", "wasm", "zenfs"]
categories = ["filesystem", "wasm"]
exclude = ["/.github/**", "/AGENTS.md", "/vendor/**"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "renfs"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
examplify = "0.3"
tempfile = "3"

# Dependencies for the standard-filesystem backend, including WASI.
[target.'cfg(not(all(target_family = "wasm", not(target_os = "wasi"))))'.dependencies]
anyhow = { version = "1", optional = true }
async-fs = "2.2"
base64 = { version = "0.23", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
dirs = "7"
filetime = "0.2"
flate2 = { version = "1", optional = true }
futures-lite = "2"
glob = "0.3"
notify = "8"
regex = { version = "1", optional = true }
tempfile = "3"
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
ureq = { version = "3", optional = true }
url = { version = "2", optional = true }

# JavaScript-backed filesystem dependencies are for browser WebAssembly targets.
[target.'cfg(all(target_family = "wasm", not(target_os = "wasi")))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
webfs = { path = "webfs", version = "0.1.1", optional = true }

[target.'cfg(all(target_family = "wasm", not(target_os = "wasi")))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target."cfg(unix)".dependencies]
libc = "0.2"

[features]
default = ["webfs", "zenfs"]
cli = [
  "dep:anyhow",
  "dep:base64",
  "dep:clap",
  "dep:flate2",
  "dep:regex",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:ureq",
  "dep:url",
]
webfs = ["dep:webfs"]
zenfs = []
